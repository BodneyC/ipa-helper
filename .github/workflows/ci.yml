name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The prepare script would install git hooks; CI does not need them.
  LEFTHOOK: '0'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser and OS dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  tex:
    # M6.4 / FR-22 / ADR-0008: every symbol's TIPA, every diacritic and every
    # pair of symbols must compile under pdflatex + tipa. The PDF is uploaded
    # so the glyphs can be checked by eye.
    name: TeX compile (pdflatex + tipa)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pdflatex and tipa
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends texlive-latex-base tipa
      - run: pnpm tex:check
      - name: Upload the compiled symbols
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tex-symbols
          path: |
            tests/tex/out/symbols.pdf
            tests/tex/out/symbols.log
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    # NFR-3 budget (M3.9): performance >= 95, accessibility = 100, LCP < 1.5 s on
    # simulated Fast 4G. Reports stay in the run's artifacts (no public upload, NFR-6).
    name: lighthouse budget
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  visual:
    # M3.8 / ADR-0005: screenshot diffs are reviewed, not gating. A failure here
    # uploads the diffs; accept intentional ones with `pnpm test:visual --update-snapshots`.
    name: visual (reviewed)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - name: Upload visual diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
