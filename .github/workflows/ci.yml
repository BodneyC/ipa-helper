name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The prepare script would install git hooks; CI does not need them.
  LEFTHOOK: '0'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser and OS dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start a silent audio device
        # Runners have no sound card. Without one, Firefox's AudioContext.resume()
        # never settles, so nothing plays and the audio specs time out. A
        # PulseAudio null sink gives the browsers somewhere to play to.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  tex:
    # M6.4 / FR-22 / ADR-0008: every symbol's TIPA, every diacritic and every
    # pair of symbols must compile under pdflatex + tipa. The PDF is uploaded
    # so the glyphs can be checked by eye.
    name: TeX compile (pdflatex + tipa)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # TeX Live's "small" scheme has pdflatex and tipa. Pulling it is quicker and
    # steadier than apt-installing TeX from Ubuntu's mirrors, which once took
    # over 10 minutes.
    container: texlive/texlive:latest-small
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git (and the prepare script's lefthook) would refuse it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tex:check
      - name: Upload the compiled symbols
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tex-symbols
          path: |
            tests/tex/out/symbols.pdf
            tests/tex/out/symbols.log
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    # NFR-3 budget (M3.9): performance >= 95, accessibility = 100, LCP < 1.5 s on
    # simulated Fast 4G. Reports stay in the run's artifacts (no public upload, NFR-6).
    name: lighthouse budget
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Let Chrome use its sandbox
        # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces, so Chrome
        # aborts with "No usable sandbox!". Lift that rather than run Lighthouse
        # with --no-sandbox, so it measures Chrome as users run it.
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true # the folder name starts with a dot
          retention-days: 14
          if-no-files-found: ignore

  visual:
    # M3.8 / ADR-0005: screenshot diffs are reviewed, not gating. A failure here
    # uploads the diffs; accept intentional ones with `pnpm test:visual --update-snapshots`.
    name: visual (reviewed)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - name: Upload visual diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
