name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The prepare script would install git hooks; CI does not need them.
  LEFTHOOK: '0'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's image has the browsers and their system packages, so the
    # job doesn't depend on Ubuntu's apt mirror, which once stalled for 20
    # minutes. Its tag must match @playwright/test (scripts/ci/images.test.ts).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root # Firefox won't start as root with someone else's HOME
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          # The touch specs (#23) run with WebKit, under the same check.
          - browser: webkit
            extra: --project=webkit-touch
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git (and the prepare script's lefthook) would refuse it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a silent audio device
        # Runners have no sound card. Without one, Firefox's AudioContext.resume()
        # never settles, so nothing plays and the audio specs time out. A
        # PulseAudio null sink gives it somewhere to play to. Chromium and
        # WebKit play without one. (ALSA's null device doesn't satisfy Firefox.)
        if: matrix.browser == 'firefox'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
      - run: pnpm test:e2e --project=${{ matrix.browser }} ${{ matrix.extra }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  tex:
    # M6.4 / FR-22 / ADR-0008: every symbol's TIPA, every diacritic and every
    # pair of symbols must compile under pdflatex + tipa. The PDF is uploaded
    # so the glyphs can be checked by eye.
    name: TeX compile (pdflatex + tipa)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # TeX Live's "small" scheme has pdflatex and tipa. Pulling it is quicker and
    # steadier than apt-installing TeX from Ubuntu's mirrors, which once took
    # over 10 minutes.
    container: texlive/texlive:latest-small
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git (and the prepare script's lefthook) would refuse it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tex:check
      - name: Upload the compiled symbols
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tex-symbols
          path: |
            tests/tex/out/symbols.pdf
            tests/tex/out/symbols.log
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    # NFR-3 budget (M3.9): performance >= 95, accessibility = 100, LCP < 1.5 s on
    # simulated Fast 4G. Reports stay in the run's artifacts (no public upload, NFR-6).
    name: lighthouse budget
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git (and the prepare script's lefthook) would refuse it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script hands lhci Playwright's Chromium through CHROME_PATH, because
      # autorun's healthcheck ignores --collect.chromePath and this image has no
      # system Chrome. Chrome won't sandbox itself as root in a container. The sandbox doesn't
      # change what Lighthouse measures, and the page is our own build.
      - run: pnpm lighthouse '--collect.settings.chromeFlags=--headless=new --no-sandbox'
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true # the folder name starts with a dot
          retention-days: 14
          if-no-files-found: ignore

  visual:
    # M3.8 / ADR-0005: screenshot diffs are reviewed, not gating. A failure here
    # uploads the diffs; accept intentional ones with `pnpm test:visual --update-snapshots`.
    name: visual (reviewed)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git (and the prepare script's lefthook) would refuse it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      - name: Upload visual diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
