name: Deploy to GitHub Pages

# Deploys only after CI has passed on main (ADR-0010).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEFTHOOK: '0'

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The 63.5 MB voice model is never committed (ADR-0009, M5.2). It is fetched
      # from a pinned revision, checked against its SHA-256, and served from Pages.
      - name: Cache the voice model
        uses: actions/cache@v6
        with:
          path: .cache/piper
          key: piper-voice-${{ hashFiles('src/adapters/audio/voice.ts') }}
      - run: pnpm voice:fetch
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build
        env:
          # e.g. "/ipa-helper/" for a project site, or "/" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
