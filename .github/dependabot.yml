version: 2
updates:
  # Dependabot's "npm" ecosystem understands pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ['type: chore', 'area: deps']
    commit-message:
      prefix: chore
      include: scope
    # Matches pnpm's minimumReleaseAge spirit: let new releases settle first.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; TS 7 (native) has no JS API yet (ADR-0011).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Types track the Node major in .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@vitest/eslint-plugin'
          - 'stylelint*'
          - 'prettier'
          - 'knip'
      test:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/test'
          - '@axe-core/*'
          - 'jsdom'
          - 'fast-check'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      build:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'size-limit'
          - '@size-limit/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['type: chore', 'area: ci']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
