name: Feature request
description: Suggest new or changed behaviour.
title: '<imperative summary, e.g. "Export X-SAMPA alongside TIPA">'
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do? Describe the observable behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable facts that would show this is done. Triage will refine these.
      placeholder: |
        - [ ] …
  - type: input
    id: refs
    attributes:
      label: Related spec sections or ADRs
      placeholder: SPEC §6, FR-20, ADR-0008
