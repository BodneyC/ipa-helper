# pnpm >= 11 reads its settings from here, not from .npmrc (see ADR-0011).
engineStrict: true
# eslint-plugin-react 7.37 and eslint-plugin-jsx-a11y 6.10 predate ESLint 10. They are
# wrapped with @eslint/compat's fixupPluginRules in eslint.config.ts (see ADR-0011).
# Remove these entries once both plugins declare ESLint 10 support.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
# Dependency install scripts stay off. lefthook's hooks are installed by the
# root "prepare" script instead.
allowBuilds:
  lefthook: false
  # Downloads the pinned ffmpeg binary that scripts/audio uses to encode symbol
  # clips (M4.3). Dev-only: ffmpeg never ships to the browser.
  ffmpeg-static: true
  # Pulled in by onnxruntime-web; its postinstall only prints a notice.
  protobufjs: false
