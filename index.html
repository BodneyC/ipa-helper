<!doctype html>
<html lang="en-GB" data-theme="dark" data-contrast="medium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build IPA transcriptions of made-up words by clicking symbols, with TIPA LaTeX output."
    />
    <meta name="color-scheme" content="dark light" />
    <title>ipa-helper</title>
    <!-- PWA (FR-60, ADR-0013). The build adds theme-color metas from tokens.css. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/ipa-helper-ipa.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/jetbrains-mono-ascii.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // No-flash theme (ADR-0006, FR-40): set data-theme and data-contrast before
      // first paint. A stored theme override wins; otherwise follow the system.
      // Once the app runs, src/adapters/document-theme.ts takes over (including
      // following system changes). Keep the storage key and values in step with
      // src/state/settings.ts.
      (function () {
        var root = document.documentElement;
        var settings = {};
        try {
          settings = JSON.parse(localStorage.getItem('ipa-helper:settings:v1') || '{}') || {};
        } catch (e) {
          settings = {};
        }
        var query = window.matchMedia('(prefers-color-scheme: light)');
        var override = settings.theme === 'dark' || settings.theme === 'light';
        root.dataset.theme = override ? settings.theme : query.matches ? 'light' : 'dark';
        root.dataset.contrast =
          settings.contrast === 'soft' || settings.contrast === 'hard'
            ? settings.contrast
            : 'medium';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
